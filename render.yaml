services:
  - type: web
    name: bypassx
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_URL
        sync: false
      - key: RATE_LIMIT_REQUESTS
        value: "10"
      - key: RATE_LIMIT_WINDOW
        value: "60"
      - key: REQUEST_TIMEOUT
        value: "60"
      - key: MAX_URL_LENGTH
        value: "4096"
      - key: MAX_REDIRECTS
        value: "10"
